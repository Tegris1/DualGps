services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dual_gps}
      POSTGRES_USER: ${POSTGRES_USER:-dual_gps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dual_gps}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-dual_gps}
      DATABASE_USERNAME: ${POSTGRES_USER:-dual_gps}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dual_gps}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
