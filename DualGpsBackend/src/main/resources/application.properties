spring.application.name=DualGpsBackend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dual_gps}
spring.datasource.username=${DATABASE_USERNAME:dual_gps}
spring.datasource.password=${DATABASE_PASSWORD:dual_gps}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
