[platformio]
default_envs = boom, arm, bucket

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:boom]
build_flags = ${env.build_flags} -DIMU_SECTION=1

[env:arm]
build_flags = ${env.build_flags} -DIMU_SECTION=2

[env:bucket]
build_flags = ${env.build_flags} -DIMU_SECTION=3
